<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lineage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.15/dist.min.js"></script>
<style>
:root{--bg:#0b0c0f;--ink:#ebe5d8;--dim:#938d80;--panel:rgba(22,23,28,.72);--solid:rgba(18,19,23,.94);--line:rgba(255,255,255,.1);--sans:Inter,system-ui,sans-serif}
:root[data-theme=light]{--bg:#f3eee5;--ink:#2a2118;--dim:#7a6c5a;--panel:rgba(251,248,242,.72);--solid:rgba(251,248,242,.95);--line:rgba(42,33,24,.13)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-optical-sizing:auto;text-rendering:optimizeLegibility;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background-color .4s}
#deck,#map{position:fixed;inset:0;width:100%;height:100%;transition:opacity .28s ease}
#deck{touch-action:none}
.fade{opacity:0}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
nav{position:fixed;top:12px;left:12px;right:12px;z-index:8;display:flex;align-items:center;gap:10px;pointer-events:none}
nav>*{pointer-events:auto}
.views{display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.views button{background:none;border:0;color:var(--dim);font:500 13px var(--sans);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.views button.on{background:var(--ink);color:var(--bg)}
.tools{margin-left:auto;display:flex;gap:6px}
.tools button,.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
#axis{position:fixed;z-index:4;pointer-events:none;border-radius:12px;overflow:hidden;transition:opacity .25s;left:12px;top:64px;bottom:12px;width:50px}
#axis span{position:absolute;right:9px;transform:translateY(-50%);font:11px var(--sans);color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
#axis span::after{content:'';position:absolute;right:-9px;top:50%;width:5px;border-top:1px solid var(--dim);opacity:.6}
body.rail #dock{left:74px;width:min(440px,calc(100vw - 482px))}
#dock{position:fixed;left:12px;bottom:12px;z-index:5;width:min(440px,calc(100vw - 420px));min-width:280px;border-radius:18px;padding:10px 12px 12px;font:12px var(--sans);color:var(--dim);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#dock header{display:flex;align-items:center;gap:8px;font:500 13px var(--sans);color:var(--ink);cursor:pointer;user-select:none}
#dock header small{font:12px var(--sans);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dock header svg{width:16px;height:16px;margin-left:auto;transition:transform .25s;flex:none}
#dock.shut header svg{transform:rotate(180deg)}
#dock .rows{display:grid;gap:10px;margin-top:10px}
#dock.shut .rows{display:none}
#dock .row>span{display:block;margin:0 0 5px 2px}
#legend,#tags{display:flex;flex-wrap:wrap;gap:4px}
#legend button,#tags button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);transition:background .15s,color .15s,border-color .15s}
#legend button::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
#legend button:hover,#tags button:hover{color:var(--ink);border-color:var(--dim)}
#legend button.on,#tags button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#tags button small{font:11px var(--sans);opacity:.7;font-variant-numeric:tabular-nums}
#ctrl{position:fixed;right:12px;bottom:12px;z-index:5;display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;border-radius:999px;font:500 12px var(--sans);color:var(--dim);transition:opacity .25s}
#ctrl input{width:min(26vw,200px);accent-color:var(--ink)}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font:500 12px var(--sans);color:var(--ink);background:var(--line)}
.pill[hidden]{display:none}
.pill:hover{background:var(--ink);color:var(--bg)}
.pill svg{width:14px;height:14px}
#ctrl,#time{transition:right .4s cubic-bezier(.2,.8,.2,1),opacity .25s}
body.po #ctrl,body.po #time{right:calc(min(400px,100vw - 24px) + 24px)}
body.po .maplibregl-ctrl-bottom-right{right:calc(min(400px,100vw - 24px) + 24px)}
#cap{position:fixed;top:60px;right:12px;z-index:9;max-width:min(26em,calc(100vw - 24px));padding:12px 16px;border-radius:14px;font-size:15px;line-height:1.45;color:var(--ink);transition:opacity .2s,transform .2s}
#cap.hide{transform:translateY(-6px)}
#cap.hide{opacity:0;pointer-events:none}
#time{position:fixed;right:12px;bottom:12px;z-index:5;display:none;align-items:center;gap:12px;padding:5px 16px 5px 5px;border-radius:999px}
#play{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
#play svg{width:16px;height:16px;fill:currentColor;stroke:none}
#time input{width:min(34vw,340px);accent-color:var(--ink)}
#time span{font:500 18px var(--sans);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
#tip{position:fixed;pointer-events:none;color:var(--ink);border-radius:10px;padding:9px 12px;font:13px/1.45 var(--sans);opacity:0;z-index:9;max-width:300px;transition:opacity .15s}
#tip b{display:block;font:600 16px/1.25 'Source Serif 4',Georgia,serif;margin-bottom:2px}#tip small{color:var(--dim)}
#panel{position:fixed;top:64px;right:12px;bottom:12px;width:min(400px,calc(100vw - 24px));z-index:7;border-radius:18px;overflow:auto;background:var(--solid);padding:20px 22px 28px;transform:translateX(calc(100% + 24px));transition:transform .4s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#panel.open{transform:none}
#panel .x{position:sticky;top:0;float:right;margin:-6px -8px 0 0;background:var(--panel)}
#panel img{width:100%;max-height:280px;object-fit:cover;object-position:50% 25%;border-radius:12px;margin:0 0 14px;display:block}
#panel h2{font-size:27px;line-height:1.15;font-weight:600;margin:0 0 6px}
#panel .meta{font:13px/1.5 var(--sans);color:var(--dim);margin:0 0 12px}
#panel .rel{font-size:17px;margin:0 0 4px}
#panel .acts{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
#panel h3{font-size:17px;font-weight:600;margin:24px 0 8px}
#panel ol,#panel ul{list-style:none;padding:0;margin:0;font:13px/1.5 var(--sans)}
#panel li button{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
#panel li button:hover{text-decoration-color:var(--ink)}
#panel .path li{display:inline}#panel .path li+li::before{content:' › ';color:var(--dim)}
#panel .kids li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
#panel .kids li.line{font-weight:500}
#panel .kids small{color:var(--dim);font-variant-numeric:tabular-nums}
#panel .bio{font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
#panel .bio h2,#panel .bio h3{font-size:17px;font-weight:600;margin:20px 0 6px}
#panel .bio a{color:inherit;text-decoration-color:var(--dim);text-underline-offset:3px}
#panel .bio ol,#panel .bio ul{font:13px/1.5 var(--sans);color:var(--dim);padding-left:18px;list-style:revert}
#panel .bio sup{font-size:10px}
#panel .wt{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font:500 13px var(--sans);color:var(--ink)}
#panel .wt svg{width:15px;height:15px}
#msg{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;color:var(--dim)}
.maplibregl-ctrl-attrib{font-family:var(--sans);font-size:10px}
@media (max-width:720px){
  nav{top:8px;left:8px;right:8px;gap:6px} .views button{padding:7px 11px;font-size:12.5px} .tools button{width:34px;height:34px}
  #axis{left:6px;top:56px;width:42px;bottom:calc(var(--dh,44px) + 64px)} #axis span{right:7px}
  #dock,body.rail #dock{left:8px;right:8px;bottom:8px;width:auto;min-width:0;max-height:60vh;overflow:auto}
  #ctrl,#time{left:8px;right:8px;bottom:calc(var(--dh,44px) + 14px)} #ctrl input,#time input{flex:1;width:auto}
  #cap{top:52px;left:8px;right:8px}
  body.po #dock,body.po #ctrl,body.po #time{opacity:0;pointer-events:none}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:72vh;transform:translateY(calc(100% + 16px))}
}
</style></head>
<body>
<div id="map" hidden></div><div id="deck"></div>
<div id="axis" class="glass"></div>
<nav><div class="views glass"></div>
  <div class="tools">
    <button id="info" class="glass" title="About this view"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/></svg></button>
    <button id="home" class="glass" title="Fit (0)"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg></button>
    <button id="theme" class="glass" title="Light / dark (t)"><svg class="i" viewBox="0 0 24 24" id="themeIcon"></svg></button>
  </div></nav>
<div id="cap" class="glass hide"></div>
<div id="ctrl" class="glass"><span>Spread</span><input id="spread" type="range" min="0" max="1" step="0.001" value="0" title="Widen horizontally ([ and ])"><button id="even" class="pill" hidden>Even out</button></div>
<div id="time" class="glass"><button id="play" title="Play (space)"></button><input id="yr" type="range" max="2026" step="1"><span id="yrl"></span></div>
<section id="dock" class="glass"><header><span>Filters</span><small id="dockNow"></small><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></header>
  <div class="rows"><div class="row"><span>Born in</span><div id="legend"></div></div><div class="row"><span>Highlight</span><div id="tags"></div></div></div></section>
<aside id="panel"></aside>
<div id="tip" class="glass"></div>
<div id="msg">Loading your family…</div>
<script>
const $ = s => document.querySelector(s);
const ICON = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  moon: '<path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6Z"/>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10.2-6.4a.8.8 0 0 0 0-1.4L9.2 4.9A.8.8 0 0 0 8 5.6Z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  close: '<svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  ext: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  widen: '<svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M3 12h18"/></svg>',
  even: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
};

// ================= regions: colour follows region, in a fixed order around the colour wheel =================
// Hues step around the wheel in roughly geographic order; dark-theme steps are luminous for the black ground.
const R = (k, d, l, re) => ({k, c: [d, l], re});
const IT = R('Italian & Mediterranean', '#e0524a', '#c23a35', /ital|sicil|sardegna|sardinia|napoli|palermo|agrigento|regno d|saluzzo|toscan|lombard|venezia|byzant|constantinople|armenia|greece|turkey|jerusalem|imperium romanum|^roman empire|albania|durazzo|cyprus|antioch|syria|egypt/i);
const IB = R('Iberian', '#f08c2e', '#dd7a1f', /spain|españa|espana|castil|le(ó|o)n\b|arag(o|ó)n|navarr|pamplona|asturias|galicia|portugal|barcelona|catalu|ribagorza|besal|hispania|urgell|cerdanya/i);
const GE = R('German & Low Countries', '#d8b04a', '#a8800f', /german|deutsch|alemanha|preu(ss|ß)en|prussia|bayern|bavaria|rhein|ren(â|a)nia|westfal|vestf|hessen|baden|w(ü|u)rtt|sachsen|saxony|holy roman|heilig|saint-empire|sacro romano|hannover|hanover|pfalz|palatinate|lotharingia|belgi|netherlands|nederland|holland|flanders|flandre|vlaanderen|brabant|hainaut|luxemb|switzerland|schweiz|austria|österreich|carinthia|frisia|th(ü|u)ring|nordgau|swabia|schwaben/i);
const AM = R('American', '#7cc35c', '#4e9c3c', /\b(usa|u\.s\.a|united states|america|colony|new england|plymouth|new york|pennsylvania|massachusetts|connecticut|new jersey|rhode island|vermont|new hampshire|maine|ohio|michigan|illinois|wisconsin|minnesota|maryland|virginia|delaware|florida|california|kentucky|indiana|iowa|missouri)\b/i);
const CE = R('Irish, Welsh & Scottish', '#22b391', '#078a6c', /ireland|(é|e)ire|wales|cymru|scotland|alba\b|powys|gwynedd|dyfed|deheubarth|gwent|morgannwg|anglesey|garth madryn|isle of man|cornwall|kernow|dumnonia|strathclyde/i);
const SCN = R('Scandinavian', '#38bfe6', '#0a9cc8', /scandi|norway|norge|denmark|danmark|sweden|sverige|iceland|orkney|jutland|vestfold|hedmark|hedermark|telemark|agder|akershus|oppland|tr(ø|o)ndelag|m(ø|o)re|sogn|(ø|o)stlandet|haithabu|hleithra|reidgotaland|onundfjord|jarldom|viken|uppsala/i);
const EN = R('English', '#4a8bf0', '#2563c4', /england|angleterre|northumbria|wessex|mercia|east anglia|united kingdom|great britain|britain|britannia|brittania|jersey|guernsey/i);
const FR = R('French & Québécois', '#b48cf2', '#8a5ad6', /france|francia|francie|francs|frankish|fr(ä|a)nkisch|carolingi|austrasi|neustria|burgond|burgund|bourgogne|provence|toulouse|gascogne|gasco(ñ|n)a|gascony|aquitaine|savoie|limoges|armorica|cornouaille|anjou|poitou|champagne|qu(é|e)bec|nouvelle|new france|acadi|bas-canada|lower canada|lorraine|alsace|normandie|normandy|bretagne|brittany|perche|canada|gen(è|e)ve/i);
const EA = R('Eastern European', '#e0609f', '#b83f84', /poland|polska|wielkopolska|kiev|kyiv|ukrain|russia|\brus\b|rus'|novgorod|polotsk|hungar|magyar|bohemia|(č|c)echy|morav|pannonia|croatia|serbia|bulgaria|lithuania|central asia|dentumogeria|yakutia|[Ѐ-ӿ]/i);
const UNK = R('Unknown', '#57544e', '#b8af9f', /$^/);
UNK.test = p => p.cu === UNK;
// where each region can plausibly be (lon0, lat0, lon1, lat1); a geocode outside these is a wrong match
const BOX = new Map([[IT, [[-10, 28, 45, 48]]], [IB, [[-10, 35, 4.5, 44.5]]], [GE, [[1.5, 44, 26, 56]]], [AM, [[-170, 15, -50, 72]]],
  [CE, [[-11, 49.8, -1, 61]]], [SCN, [[4, 53.5, 32, 72], [-25, 62.5, -12, 67.5], [-4, 58, 0, 61]]], [EN, [[-7, 49, 2, 56.5]]],
  [FR, [[-5.5, 41, 10, 51.6], [-80, 42, -52, 53], [-95, 28, -88, 33]]], [EA, [[12, 34, 60, 72]]]]);
function plausible(loc, ll, era) {
  if (!ll || !ll.length) return null;
  const cu = culture(loc), [x, y] = ll;
  if (cu) return BOX.get(cu).some(([a, b, c, d]) => x >= a && x <= c && y >= b && y <= d) ? ll : null;
  if (era < 1500 && !(x > -25 && x < 60 && y > 25 && y < 72)) return null;   // medieval: Europe and the Near East only
  if (era < 1750 && (y < 15 || x > 60)) return null;
  return ll;
}
const REGIONS = [IT, IB, GE, AM, CE, SCN, EN, FR, EA];
for (const c of [...REGIONS]) c.test = p => p.cu === c;
// highlights from WikiTree categories and profile stickers
const TAG = (k, re, tpl) => ({k, test: p => (p.Cats || []).some(c => re.test(c)) || (p.Tpl || []).some(t => tpl.test(t))});
const TAGS = [
  TAG('Notables', /notables|featured_royalty|^saints$/i, /notables/i),
  TAG('Royalty & nobility', /royal|kings?_|kingdom_of|nobility|barony|earls_of|dukes|counts_of|rulers|high_kings|aristocrat|princes/i, /euroaristo|aristocrat|royals|succession/i),
  TAG('Magna Carta', /magna_carta|surety_barons/i, /magna carta/i),
  TAG('Crusaders & soldiers', /crusade|war\b|wars\b|_war_|military|army|navy|soldier|veteran|militia|regiment|patriot|loyalist|knights/i, /military|war\b|revolution|soldier|veteran|navy|army|crusade/i),
  TAG('Migrants & settlers', /immigra|emigra|migrants|great_migration|filles_|pioneers|settlers|founders/i, /migrating ancestor|great migration|acadian|filles|pioneer|immigra/i),
  TAG('Mayflower', /mayflower/i, /mayflower/i),
];
function culture(loc) {   // first segment that names a known place wins ("Edinburgh, Scotland, United Kingdom" -> Scottish)
  if (!loc) return null;
  for (const s of loc.split(',').map(x => x.trim())) for (const c of REGIONS) if (c.re.test(s)) return c;
  return null;
}
function regionAt(lon, lat) {   // fallback from geocoded coordinates when the place name didn't say
  if (lon < -50) return lat > 45 && lon > -80 ? FR : AM;
  if (lat > 54.5 && lon > 4 && lon < 35) return SCN;
  if (lon < -5.4 && lat > 51.3 && lat < 55.5) return CE;
  if (lon < 1.8 && lat > 49.9 && lat < 61) return lat > 55.1 || (lon < -3 && lat > 51.3 && lat < 53.5) || lon < -4.8 ? CE : EN;
  if (lon < 3.4 && lat > 35 && lat < 43.8) return IB;
  if (lon >= 6.6 && lon < 19 && lat > 36 && lat < 46.6) return IT;
  if (lon > -5 && lon < 8.2 && lat > 42 && lat < 51.1) return FR;
  if (lon >= 3 && lon < 17 && lat >= 45.8 && lat < 55.5) return GE;
  if (lat < 42 && lon > 19) return IT;
  if (lon >= 15) return EA;
  return null;
}

// ================= data =================
const yr = d => { const m = /^(\d{4})/.exec(d || ''); return m && m[1] !== '0000' ? +m[1] : null; };
let N = [], ROOT, Y0 = 1450, leafN = 0, LEAVES = [];
const BY = p => p.by ?? p.byE;
const TP = .6, tn = v => 1 - Math.pow(Math.max(0, 2026 - v) / (2026 - Y0), TP);   // Y0 -> 0, today -> 1
async function load() {
  const [tree, places] = await Promise.all([fetch('tree.json').then(r => r.json()), fetch('places.json').then(r => r.json()).catch(() => ({}))]);
  const P = tree.people, G = loc => { const g = places[(loc || '').trim()]; return g?.length >= 5 ? [g[0], g[1]] : null; };   // only verified geocodes
  const jit = (ll, id, s) => [ll[0] + ((id % 97) / 97 - .5) * s, ll[1] + ((id % 89) / 89 - .5) * s * .66];
  for (const p of Object.values(P)) {
    p.given = p.FirstName || p.RealName || 'Unknown'; p.sur = p.LastNameAtBirth || p.LastNameCurrent || '';
    p.by = yr(p.BirthDate); p.dy = yr(p.DeathDate);
    // a pre-1500 place that geocoded to the Americas is a name collision (a US town sharing a medieval name): ignore it
    const era = p.by ?? p.dy ?? 1500, ok = loc => plausible(loc, G(loc), era);
    const b = ok(p.BirthLocation), d = ok(p.DeathLocation), m = (p.Marriages || []).map(x => ok(x.place)).find(Boolean);
    const hasBirth = !!(p.BirthLocation || '').trim();
    p.loc = hasBirth ? b : d || m; p.how = !p.loc ? (hasBirth ? 'pending' : null) : hasBirth ? 'birth' : d ? 'death' : 'marriage';
    const g = places[((hasBirth ? p.BirthLocation : d ? p.DeathLocation : '') || '').trim()];
    p.approx = !!(p.loc && g && (g[2] > 0 || !g[3]));   // only a broader area matched (a county, a region, a country)
    if (p.loc) p.loc = jit(p.loc, p.Id, .04);
    p.cu = culture(p.BirthLocation) || culture(p.DeathLocation) || (b && regionAt(...b)) || (d && regionAt(...d)) || UNK;
  }
  // nodes: one per place a person occupies in the pedigree. A person reached again (pedigree collapse) is a

  layers() {

  pills() {   // year labels on a radial scale along the first visible spoke (straight up when possible)
    const out = [], placed = [];
    for (const step of [500, 100, 50, 25, 10, 5]) for (let v = Math.ceil(Y0 / step) * step; v <= 2020; v += step) {
      if (out.some(o => o.v === v)) continue;
      let best = null;
      for (const deg of [-90, -60, -120, -30, -150, 0, 180, 30, 150, 60, 120, 90]) {   // first visible spoke, so labels line up radially
        const [wx, wy] = this.p(v, deg * Math.PI / 180), x = SX(wx), y = SY(wy);
        if (x > 80 && x < W - 60 && y > 80 && y < H - 70) { best = {v, pos: [wx, wy], sx: x, sy: y}; break; }
      }
      if (!best || placed.some(([x, y]) => Math.abs(x - best.sx) < 54 && Math.abs(y - best.sy) < 24)) continue;

      fontFamily: 'Inter, system-ui, sans-serif', fontWeight: 500, getColor: [...INK(), 235], background: true, getBackgroundColor: dark ? [22, 23, 28, 240] : [251, 248, 242, 245],
      getBorderColor: [...INK(), 70], getBorderWidth: 1, backgroundPadding: [8, 4], backgroundBorderRadius: 10, characterSet: '0123456789-',

// ---- constellation: MapLibre basemap + deck.gl overlay; time is a GPU filter, so scrubbing costs nothing
let map, overlay, T = 2026, playing = false, lastT = 0;
const TIME = new deck.DataFilterExtension({filterSize: 1});
const constellation = {name: 'Constellation', map: true,
  cap: 'Every ancestor is a star at their birthplace, and arcs join each birth to their child’s. Hollow stars are approximate: only a region is known, or they share a parent’s or child’s place; people with nothing known nearby are left off. Press play to sweep through the centuries; zoom in for real towns; click a star for the full story.',
  build() {
    const ns = N.filter(n => !n.dup && n.p.loc);
    this.stars = ns.map(n => ({n, pos: n.p.loc, v: BY(n.p), inf: n.p.how === 'inferred' || n.p.approx}));
    this.arcs = N.filter(n => n.c && n.p.loc && n.c.p.loc).map(n => {
      const [x0, y0] = n.p.loc, [x1, y1] = n.c.p.loc, d = Math.hypot(x1 - x0, y1 - y0), mx = (x0 + x1) / 2, my = (y0 + y1) / 2 + d * .18, path = [];
      const k = Math.max(4, Math.min(48, Math.ceil(d * 2)));
      for (let i = 0; i <= k; i++) { const t = i / k; path.push([(1 - t) ** 2 * x0 + 2 * t * (1 - t) * mx + t * t * x1, (1 - t) ** 2 * y0 + 2 * t * (1 - t) * my + t * t * y1]); }
      return {n, path, v: BY(n.c.p)};
    });
    const xs = ns.map(n => n.p.loc[0]).sort((a, b) => a - b), ys = ns.map(n => n.p.loc[1]).sort((a, b) => a - b), q = (a, f) => a[Math.floor(f * (a.length - 1))];
    this.bounds = [[q(xs, .01), q(ys, .01)], [q(xs, .99), q(ys, .99)]];   // ignore far outliers when fitting
  },
  layers() {
    const fr = {filterRange: [Y0 - 1, T], filterSoftRange: [Y0 - 1, T - 12], extensions: [TIME], getFilterValue: d => d.v};
    return [
      new deck.PathLayer({id: 'arcs', data: this.arcs, getPath: d => d.path, getWidth: 1, widthUnits: 'pixels',
        getColor: d => [...CC(d.n.p.cu), A(d.n, dark ? 70 : 90, 8)], parameters: blendP(), ...fr, updateTriggers: {getColor: [fkey, dark]}, transitions: FADE}),
      new deck.ScatterplotLayer({id: 'glow', data: this.stars, getPosition: d => d.pos, radiusUnits: 'pixels', getRadius: d => d.inf ? 6 : 10,
        getFillColor: d => [...CC(d.n.p.cu), A(d.n, d.inf ? 26 : 46, 4)], parameters: blendP(), ...fr, updateTriggers: {getFillColor: [fkey, dark]}, transitions: FADE}),
      new deck.ScatterplotLayer({id: 'core', data: this.stars, getPosition: d => d.pos, radiusUnits: 'pixels', getRadius: d => d.inf ? 2.4 : 2.6,
        stroked: true, lineWidthUnits: 'pixels', getLineWidth: d => d.inf ? 1.2 : .8, pickable: true, ...fr,
        getFillColor: d => d.inf ? [...BG(), A(d.n, 200, 20)] : dark ? [255, 248, 236, A(d.n, 255, 30)] : [...CC(d.n.p.cu), A(d.n, 255, 30)],
        getLineColor: d => [...CC(d.n.p.cu), A(d.n, 255, 30)], updateTriggers: {getFillColor: [fkey, dark], getLineColor: [fkey, dark]}, transitions: FADE}),
    ];
  },
};
const styleURL = () => `https://basemaps.cartocdn.com/gl/${dark ? 'dark-matter' : 'positron'}-gl-style/style.json`;
function setT(t) { T = t; $('#yr').value = Math.round(t); $('#yrl').textContent = Math.round(t); redraw(); }
function initMap() {
  constellation.build();
  map = new maplibregl.Map({container: 'map', style: styleURL(), bounds: constellation.bounds, fitBoundsOptions: {padding: 70}, attributionControl: {compact: true}});
  overlay = new deck.MapboxOverlay({interleaved: false, layers: constellation.layers(), pickingRadius: 10,
    onHover: ({object, x, y}) => { const n = object?.n ?? null; if (n !== hov) { hov = n; refocus(); } showTip(n, x, y); },
    onClick: ({object}) => object ? select(object.n) : closePanel(),
    getCursor: ({isHovering}) => isHovering ? 'pointer' : 'grab'});
  map.addControl(overlay);
}
function play(on) {
  playing = on; $('#play').innerHTML = on ? ICON.pause : ICON.play;
  if (on) { if (T >= 2026) setT(Y0); lastT = performance.now(); requestAnimationFrame(tick); }
}
function tick(now) {
  if (!playing) return;
  const t = Math.min(2026, T + (now - lastT) / 1000 * 30); lastT = now; setT(t);
  t < 2026 ? requestAnimationFrame(tick) : play(false);
}
$('#play').onclick = () => play(!playing);
$('#yr').oninput = e => { play(false); setT(+e.target.value); };

// ---- spread: a horizontal stretch applied on the GPU (modelMatrix), keeping the middle of the screen in place
function setSpread(v) {
  const s1 = 2 ** (v * 4); $('#spread').value = v;
  if (!VIEW?.spread) { stretch = s1; return; }
  const tx = W / 2 + (vs.target[0] - W / 2) * s1 / stretch; stretch = s1;
  vs = {...home(), target: [tx, vs.target[1], 0], zoom: vs.zoom};
  deckgl.setProps({initialViewState: {o: vs}});
  redraw();
}
$('#spread').oninput = e => setSpread(+e.target.value);
$('#even').onclick = () => widen(null);

// ================= shell =================
const VIEWS = [tributaries, constellation, rings];
const nav = $('.views'), capEl = $('#cap'), mapEl = $('#map'), legendEl = $('#legend');
nav.innerHTML = VIEWS.map((v, i) => `<button data-i="${i}">${v.name}</button>`).join('');
nav.onclick = e => e.target.dataset.i && show(VIEWS[+e.target.dataset.i]);
$('#info').onclick = e => { e.stopPropagation(); capEl.classList.toggle('hide'); };
addEventListener('pointerdown', e => { if (!capEl.contains(e.target) && !e.target.closest('#info')) capEl.classList.add('hide'); });
$('#home').onclick = () => VIEW.map ? map.fitBounds(constellation.bounds, {padding: 70}) : flyTo(home().target.slice(0, 2), 0);
$('#theme').onclick = () => { dark = !dark; try { localStorage.setItem('lineage-theme', dark ? 'dark' : 'light'); } catch {} applyTheme(); if (map) map.setStyle(styleURL()); };
// legend: hover (or tap) a region to light everyone born there
function legend() {
  const seen = new Set(N.map(n => n.p.cu));
  legendEl.innerHTML = [...REGIONS, UNK].filter(c => seen.has(c)).map(c => `<button data-k="${c.k}" style="--c:${c.c[dark ? 0 : 1]}">${c.k}</button>`).join('');
  legendState();
}
// controls sit just above the legend, whatever height it wraps to
const dockEl = $('#dock');
new ResizeObserver(() => document.documentElement.style.setProperty('--dh', dockEl.offsetHeight + 'px')).observe(dockEl);
try { if (localStorage.getItem('lineage-dock') === 'shut' || (innerWidth < 720 && localStorage.getItem('lineage-dock') !== 'open')) dockEl.classList.add('shut'); } catch {}
dockEl.querySelector('header').onclick = () => { dockEl.classList.toggle('shut'); try { localStorage.setItem('lineage-dock', dockEl.classList.contains('shut') ? 'shut' : 'open'); } catch {} };
const tagsEl = $('#tags');
const groupByK = k => [...REGIONS, UNK, ...TAGS].find(c => c.k === k);
function legendState() {
  for (const b of [...legendEl.querySelectorAll('button'), ...tagsEl.querySelectorAll('button')]) b.classList.toggle('on', hlCu?.k === b.dataset.k || pinCu?.k === b.dataset.k);
  $('#dockNow').textContent = pinCu ? '· ' + pinCu.k : '';   // what's pinned stays visible even when the dock is shut
}
function pinnable(el) {   // hover previews a group, click pins it (click again or Esc to release)
  el.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const c = groupByK(e.target.closest('button')?.dataset.k); if (c && c !== hlCu) { hlCu = c; refocus(); } });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && hlCu !== pinCu) { hlCu = pinCu; refocus(); } });
  el.addEventListener('click', e => {
    const c = groupByK(e.target.closest('button')?.dataset.k); if (!c) return;
    pinCu = pinCu === c ? null : c; hlCu = pinCu; refocus();
  });
}
pinnable(legendEl); pinnable(tagsEl);
function tags() {
  const seen = new Set(), cnt = new Map(TAGS.map(t => [t, 0]));
  for (const n of N) if (!seen.has(n.p)) { seen.add(n.p); for (const t of TAGS) if (t.test(n.p)) cnt.set(t, cnt.get(t) + 1); }
  tagsEl.innerHTML = TAGS.filter(t => cnt.get(t)).map(t => `<button data-k="${t.k}">${t.k}<small>${cnt.get(t).toLocaleString()}</small></button>`).join('');
}
function applyTheme() {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.style.setProperty('--bg', VIEW.map ? (dark ? '#0e0e10' : '#fafaf8') : VIEW.bg[dark ? 0 : 1]);
  $('#themeIcon').innerHTML = dark ? ICON.sun : ICON.moon;
  legend(); tags(); legendState(); redraw();
}
function show(v) {
  const swap = () => {
    VIEW = v; hov = null; showTip(null); play(false); labelCache = {};
    nav.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', VIEWS[i] === v));
    capEl.textContent = v.cap; host.hidden = !!v.map; mapEl.hidden = !v.map;
    $('#time').style.display = v.map ? 'flex' : 'none';
    $('#ctrl').style.display = v.spread ? 'flex' : 'none';
    axisEl.style.opacity = v.y ? 1 : 0; document.body.classList.toggle('rail', !!v.y);
    if (v.map) { if (!map) { initMap(); setTimeout(() => play(true), 1500); } else map.resize(); }
    else {
      v.layout(); vs = home();
      if (!deckgl) initDeck(); else deckgl.setProps({initialViewState: {o: home()}});
      if (sel) select(sel, true);
    }
    applyTheme(); requestAnimationFrame(() => { host.classList.remove('fade'); mapEl.classList.remove('fade'); });
  };
  if (!VIEW || VIEW === v) return swap();
  host.classList.add('fade'); mapEl.classList.add('fade'); setTimeout(swap, 220);
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key >= '1' && e.key <= String(VIEWS.length)) show(VIEWS[+e.key - 1]);
  if (e.key === '0') $('#home').click();
  if (e.key === 't') $('#theme').click();
  if (e.key === '[' || e.key === ']') setSpread(Math.min(1, Math.max(0, +$('#spread').value + (e.key === ']' ? .08 : -.08))));
  if (e.key === ' ' && VIEW.map) { e.preventDefault(); play(!playing); }
  if (e.key === 'Escape') { closePanel(); if (hlCu || pinCu) { hlCu = pinCu = null; refocus(); } }
  if (sel && ['ArrowUp', 'ArrowDown'].includes(e.key)) {   // walk the line: up = father (shift: mother), down = child
    e.preventDefault(); const n = e.key === 'ArrowDown' ? sel.c : (e.shiftKey ? sel.m || sel.f : sel.f || sel.m); if (n) select(n, true);
  }
});
function size() { W = innerWidth; H = innerHeight; }
addEventListener('resize', () => { size(); if (VIEW && !VIEW.map) { VIEW.layout(); labelCache = {}; vs = home(); deckgl?.setProps({initialViewState: {o: vs}}); redraw(); } });
size();
Promise.all([load(), document.fonts.ready]).then(() => { $('#msg').remove(); show(tributaries); })
  .catch(err => { $('#msg').textContent = 'Couldn’t load tree.json. Run pull.py first. (' + err.message + ')'; console.error(err); });
</script>
