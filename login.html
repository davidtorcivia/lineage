<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lineage</title>
<meta name="description" content="Every known ancestor, through time and across the map.">
<meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website"><meta property="og:site_name" content="Lineage"><meta property="og:title" content="Lineage">
<meta property="og:description" content="Every known ancestor, through time and across the map."><meta property="og:url" content="__ORIGIN__/">
<meta property="og:image" content="__ORIGIN__/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Lineage">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('lineage-theme'); if (t) document.documentElement.dataset.theme = t } catch {}</script>
<style>
:root{--bg:#f3eee5;--ink:#2a2118;--dim:#7a6c5a;--field:rgba(251,248,242,.75);--line:rgba(42,33,24,.16);--strand:rgba(122,108,90,.22);--err:#a3402b;--sans:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0c0f;--ink:#ebe5d8;--dim:#938d80;--field:rgba(22,23,28,.7);--line:rgba(255,255,255,.13);--strand:rgba(235,229,216,.13);--err:#e08a72}}
:root[data-theme=dark]{--bg:#0b0c0f;--ink:#ebe5d8;--dim:#938d80;--field:rgba(22,23,28,.7);--line:rgba(255,255,255,.13);--strand:rgba(235,229,216,.13);--err:#e08a72}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{display:grid;place-items:center;padding:16px;font-family:'Source Serif 4',Georgia,serif;font-optical-sizing:auto;-webkit-tap-highlight-color:transparent}
svg.strands{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
svg.strands{animation:fade 2.4s ease both}
svg.strands path{fill:none;stroke:var(--strand);stroke-width:1;vector-effect:non-scaling-stroke}
@keyframes fade{from{opacity:0}}
main{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:36px;animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
h1{margin:0;font-weight:300;font-size:clamp(52px,14vw,72px);line-height:1;letter-spacing:-.01em}
form{width:100%;position:relative}
input{width:100%;font:400 16px var(--sans);color:var(--ink);background:var(--field);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:15px 60px 15px 22px;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--dim)}
input:focus{border-color:var(--dim);box-shadow:0 0 0 4px var(--line)}
button{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
button:hover{transform:translateX(2px)}
button:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#err{position:absolute;left:0;right:0;top:calc(100% + 12px);margin:0;text-align:center;color:var(--err);font:14px var(--sans)}
form.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<svg class="strands" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <path d="M-5 8 C30 14 38 44 50 50 S72 88 105 94"/>
  <path d="M-5 26 C26 30 36 46 50 50 S74 74 105 80"/>
  <path d="M-5 44 C24 46 38 49 50 50 S76 58 105 64"/>
  <path d="M-5 62 C24 58 38 52 50 50 S76 42 105 40"/>
  <path d="M-5 80 C26 72 36 56 50 50 S74 24 105 20"/>
  <path d="M-5 96 C30 88 40 58 50 50 S70 10 105 4"/>
</svg>
<main>
  <h1>Lineage</h1>
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required autofocus>
    <button aria-label="Enter"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <p id="err" role="alert"></p>
  </form>
</main>
<script>
const wait = location.search.includes('wait')
if (wait || location.search.includes('wrong')) {
  document.getElementById('err').textContent = wait ? 'Too many tries. Wait a few minutes, then try again.' : 'Not quite. Try again.'
  document.querySelector('form').classList.add('wrong')
  history.replaceState(null, '', '/')
}
</script>
</body></html>
